<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatalog - Library Catalog Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <!-- Header Navigation -->
    <header class="header">
        <div class="header__logo">
            <img class="header__logo-placeholder" src="/chataloglogo.png" alt="Chatalog logo">
        </div>
        
        <nav class="header__nav">
            <a href="AboutUs.html" class="header__nav-link">About Us</a>
            <a href="ExploreKG.html" class="header__nav-link">Explore Knowledge Graph</a>
            <a href="https://www.spl.org" class="header__nav-link" target="_blank">Seattle Public Library</a>
        </nav>
        
        <div class="header__actions">
            <!-- Logged out state -->
            <a href="#" class="header__account-link" id="loginBtn">My Account</a>
            
            <!-- Logged in state (hidden by default) -->
            <div class="header__user-menu hidden" id="userMenu">
                <button class="header__user-btn" id="userMenuBtn">
                    <span class="header__user-avatar" id="userAvatar">U</span>
                    <span class="header__username" id="usernameDisplay">User</span>
                </button>
                <div class="header__dropdown hidden" id="userDropdown">
                    <a href="#" class="header__dropdown-item" id="myChatsBtn">
                        <span>💬</span> My Chats
                    </a>
                    <hr class="header__dropdown-divider">
                    <a href="#" class="header__dropdown-item header__dropdown-item--danger" id="logoutBtn">
                        <span>🚪</span> Sign Out
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Auth Modal -->
    <div class="modal hidden" id="authModal">
        <div class="modal__backdrop" id="modalBackdrop"></div>
        <div class="modal__content">
            <button class="modal__close" id="modalClose">&times;</button>
            
            <!-- Login Form -->
            <div class="modal__form" id="loginForm">
                <h2 class="modal__title">Welcome Back</h2>
                <p class="modal__subtitle">Sign in to access your chat history</p>
                
                <div class="form__group">
                    <label class="form__label" for="loginEmail">Email</label>
                    <input type="email" class="form__input" id="loginEmail" placeholder="your@email.com" required>
                </div>
                
                <div class="form__group">
                    <label class="form__label" for="loginPassword">Password</label>
                    <input type="password" class="form__input" id="loginPassword" placeholder="Enter password" required>
                </div>
                
                <div class="form__error hidden" id="loginError"></div>
                
                <button class="form__submit" id="loginSubmit">Sign In</button>
                
                <p class="modal__switch">
                    Don't have an account? <a href="#" id="showRegister">Create one</a>
                </p>
            </div>
            
            <!-- Register Form -->
            <div class="modal__form hidden" id="registerForm">
                <h2 class="modal__title">Create Account</h2>
                <p class="modal__subtitle">Join Chatalog to save your chat history</p>
                
                <div class="form__group">
                    <label class="form__label" for="registerName">Name</label>
                    <input type="text" class="form__input" id="registerName" placeholder="Your name" required>
                </div>
                
                <div class="form__group">
                    <label class="form__label" for="registerEmail">Email</label>
                    <input type="email" class="form__input" id="registerEmail" placeholder="your@email.com" required>
                </div>
                
                <div class="form__group">
                    <label class="form__label" for="registerPassword">Password</label>
                    <input type="password" class="form__input" id="registerPassword" placeholder="Min 6 characters" required>
                </div>
                
                <div class="form__group">
                    <label class="form__label" for="registerCard">SPL Library Card (Optional)</label>
                    <input type="text" class="form__input" id="registerCard" placeholder="Your library card number">
                </div>
                
                <div class="form__error hidden" id="registerError"></div>
                
                <button class="form__submit" id="registerSubmit">Create Account</button>
                
                <p class="modal__switch">
                    Already have an account? <a href="#" id="showLogin">Sign in</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Sidebar with Chat History -->
        <aside class="sidebar">
            <div class="sidebar__header">
                <button class="sidebar__new-chat-btn" id="newChatBtn">
                    <span class="sidebar__new-chat-icon">+</span>
                    New Chat
                </button>
            </div>
            
            <div class="sidebar__history">
                <h2 class="sidebar__history-title">History</h2>
                <ul class="sidebar__chat-list" id="chatHistory">
                    <!-- Chat history items will be dynamically populated here -->
                </ul>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="main-content">
            <div class="main-content__header">
                <h1 class="main-content__title">Welcome to Chatalog</h1>
            </div>
            
            <div class="main-content__chat-area" id="chatArea">
                <!-- Chat messages will be dynamically populated here -->
            </div>
            
            <div class="main-content__input-area">
                <input 
                    type="text" 
                    class="main-content__input" 
                    id="messageInput"
                    placeholder="Ask about books, authors, or genres..."
                    autocomplete="off"
                />
                <button class="main-content__send-btn" id="sendBtn">→</button>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
    <script src="auth.js"></script>
</body>
</html>
